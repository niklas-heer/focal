[package]
name = "focal"
version = "0.3.0"
description = "A focused Markdown editor for macOS, opened from the terminal."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
anyhow = "1.0.104"
async-channel = "2.5.0"
focal-core.workspace = true
imagesize = "0.15.0"
layout-rs = "0.1.3"
merman = { version = "0.7.0", features = ["render"] }
pikchr = "0.1.4"
wavedrom = "0.1.0"
# 0.7.4 and later pin `futures` 0.3.30 through `sauron`, which GPUI outgrew.
svgbob = "=0.7.2"
# Glyph advances for Vega text widths; the version fontdb uses.
ttf-parser = "0.25.1"
# Pictures of math and diagrams for Copy as HTML; the SVG renderer GPUI uses.
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
notify = "8.2.0"
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
gpui-kit = { version = "=0.7.0", default-features = false, features = ["component", "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-css", "tree-sitter-diff", "tree-sitter-go", "tree-sitter-html", "tree-sitter-java", "tree-sitter-javascript", "tree-sitter-kotlin", "tree-sitter-lua", "tree-sitter-make", "tree-sitter-php", "tree-sitter-python", "tree-sitter-ruby", "tree-sitter-rust", "tree-sitter-sql", "tree-sitter-swift", "tree-sitter-toml", "tree-sitter-tsx", "tree-sitter-typescript", "tree-sitter-yaml", "tree-sitter-zig"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAlert", "NSAppearance", "NSApplication", "NSButton", "NSControl", "NSGraphics", "NSPasteboard", "NSPrintInfo", "NSPrintOperation", "NSPrintPanel", "NSResponder", "NSSpellChecker", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKNavigation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSGeometry", "NSOrthography", "NSRange", "NSString", "NSTextCheckingResult", "NSURL", "NSValue"] }
unicode-segmentation.workspace = true

[lints]
workspace = true

[dev-dependencies]
gpui-kit = { version = "=0.7.0", default-features = false, features = ["component", "test-support", "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-css", "tree-sitter-diff", "tree-sitter-go", "tree-sitter-html", "tree-sitter-java", "tree-sitter-javascript", "tree-sitter-kotlin", "tree-sitter-lua", "tree-sitter-make", "tree-sitter-php", "tree-sitter-python", "tree-sitter-ruby", "tree-sitter-rust", "tree-sitter-sql", "tree-sitter-swift", "tree-sitter-toml", "tree-sitter-tsx", "tree-sitter-typescript", "tree-sitter-yaml", "tree-sitter-zig"] }
