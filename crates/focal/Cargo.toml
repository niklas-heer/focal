[package]
name = "focal"
version = "0.0.0"
description = "A focused Markdown editor for macOS, opened from the terminal."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
focal-core.workspace = true
gpui-kit = { version = "=0.7.0", default-features = false, features = ["component"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSSpellChecker"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSRange", "NSString"] }
unicode-segmentation.workspace = true

[lints]
workspace = true
