[package]
name = "focal-core"
version = "0.0.0"
description = "Focal's editor model: Markdown analysis, line display maps and the edit buffer, independent of any UI toolkit."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
emojis = "0.9.0"
encoding_rs = "0.8.42"
pulldown-cmark = { workspace = true, features = ["html"] }
unicode-segmentation.workspace = true
unicode-width = "0.2.2"

[lints]
workspace = true
